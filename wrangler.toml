#:schema https://raw.githubusercontent.com/cloudflare/wrangler/main/schemas/wrangler-schema.json
name = "voxelvein-frontend"
main = ".output/server/index.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat_v2"]

[assets]
directory = ".output/public"
binding = "ASSETS"

[vars]
# Build-time/runtime environment is usually set with `wrangler secret put` or
# in the Cloudflare dashboard. NITRO_PRESET=cloudflare_module must be set for
# the build, not at runtime.
NITRO_PRESET = "cloudflare_module"

# Hourly account purge is generated by Nitro from `scheduledTasks` in
# vite.config.ts when building with the cloudflare_module preset, so no
# `triggers.crons` block is needed here.

name: Main

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation-only pushes cannot change the build, the bundle, or the
      # schema, so they skip the slow jobs. docs.yml still runs for them.
      - "**/*.md"
      - "docs/**"
      - ".opencode/**"

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/_quality.yml

  docker:
    name: Docker build
    needs: quality
    uses: ./.github/workflows/_docker.yml

name: Docs

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]
  # Started by claude-auto-merge after a bot merge, since merges made with
  # GITHUB_TOKEN don't fire push events.
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Lint Markdown
        run: pnpm lint:md

  accessibility:
    name: Markdown accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Check Markdown accessibility
        run: pnpm lint:md

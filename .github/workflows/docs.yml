name: Docs

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]
    paths-ignore:
      # Not documentation: let the Main and Pull Request workflows own it.
      - "**/*.md"
      - "docs/**"
      - ".opencode/**"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Lint Markdown
        run: pnpm lint:md

  links:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Every relative link and heading anchor in docs/ and the root Markdown
      # files. These break silently: a renamed section leaves the link
      # pointing at a heading that no longer exists, and markdownlint has no
      # rule for it.
      - name: Verify internal links resolve
        run: pnpm docs:check

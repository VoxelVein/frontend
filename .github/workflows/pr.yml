name: Pull Request

on:
  pull_request:
    branches: [main, prod]
  # Started by claude-auto-merge after it pushes, since pushes made with
  # GITHUB_TOKEN don't fire pull_request. Checks from these runs attach to the
  # branch head, so they satisfy the required checks on the PR.
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce source branch for prod
        # Pass PR fields through env instead of interpolating them into the
        # script, so a crafted branch name cannot inject shell commands.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # A fork's branch named "main" must not satisfy the policy, so the
          # head repository has to be this repository too.
          if [ "$BASE_REF" = "prod" ] && \
             { [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; }; then
            echo "::error::Pull requests into 'prod' must come from 'main'."
            exit 1
          fi
          echo "Source branch policy satisfied."

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Lint & format check
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check bundle size
        run: pnpm check:bundle --no-build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

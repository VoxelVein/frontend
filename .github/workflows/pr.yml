name: Pull Request

on:
  pull_request:
    branches: [main, prod]
    paths-ignore:
      # A Markdown-only change cannot fail the gate or break the image. The
      # Docs workflow still lints it on the same events.
      - "**/*.md"
      - "docs/**"
      - ".opencode/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce source branch for prod
        # Pass PR fields through env instead of interpolating them into the
        # script, so a crafted branch name cannot inject shell commands.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # A fork's branch named "main" must not satisfy the policy, so the
          # head repository has to be this repository too.
          if [ "$BASE_REF" = "prod" ] && \
             { [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; }; then
            echo "::error::Pull requests into 'prod' must come from 'main'."
            exit 1
          fi
          echo "Source branch policy satisfied."

  quality:
    name: Quality checks
    uses: ./.github/workflows/_quality.yml

  docker:
    name: Docker build
    needs: quality
    uses: ./.github/workflows/_docker.yml

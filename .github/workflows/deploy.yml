name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Lint & format check
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Check bundle size
        run: pnpm check:bundle --no-build

  deploy:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names and version
        id: meta
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the VITE_API_URL repository variable to the public API URL."
            exit 1
          fi
          if [ -z "$VITE_SITE_URL" ]; then
            echo "::error::Set the VITE_SITE_URL repository variable to the public web app URL."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Images are tagged with the package.json version (what is deployed) and
      # the commit SHA (exactly which build). There is no floating `latest`.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ vars.GITHUB_CLIENT_ID }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-api:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-migrate:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

# Development override for VoxelVein Frontend.
#
# Mounts the source tree and runs the Vite dev server with hot reload.
#
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up

services:
  web:
    image: voxelvein-frontend:dev
    build:
      target: deps
    ports:
      - "${WEB_PORT:-1112}:6001"
      # `pnpm dev` also runs the API inside this container.
      - "${API_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      # `pnpm dev` runs inside this container. Vite defaults to 3000 for local
      # use, so pin it to 6001 to match the published port above.
      PORT: 6001
      # The API runs in this same container under `pnpm dev`.
      API_URL: http://localhost:3002
      # Rate-limit counters. The valkey service is kept in the dev stack (it is
      # not under the `prod` profile below) because web and api both need it.
      VALKEY_URL: redis://valkey:6379
    volumes:
      # Mount source for hot reload
      - .:/app
      # Anonymous volume to keep node_modules from the image (not overwritten by the bind mount)
      - /app/node_modules
    command: pnpm dev
    restart: "no"
    # The dev server runs the API itself and migrations stay manual
    # (`pnpm db:migrate`), so drop the production-only services below.
    # `!reset` clears the inherited list outright rather than merging with it;
    # a merged list would keep pointing at `migrate`, which the `prod` profile
    # above removes and which therefore does not exist in the dev project.
    # Valkey is deliberately not gated on here: it is not under a profile, so it
    # still starts, and the limiter retries if it is not up on the first request.
    depends_on: !reset {}

  migrate:
    profiles: [prod]

  api:
    profiles: [prod]
